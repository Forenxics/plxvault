[workspace]
resolver = "2"
members = [
    "crates/plxvault-core",
    "crates/plxvault-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PlxVault Team"]
license = "MIT"
repository = "https://github.com/plxvault/plxvault-ca"

[workspace.dependencies]
# Crypto
rcgen = "0.13"
ring = "0.17"
x509-parser = "0.16"
pem = "3.0"
sha2 = "0.10"
hex = "0.4"

# PQC (Post-Quantum)
pqcrypto-dilithium = "0.5"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
time = { version = "0.3", features = ["formatting", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }

# Python bindings
pyo3 = { version = "0.21", features = ["extension-module"] }

# Async
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
